name: Validate SPDX Conformance

on:
  workflow_dispatch: {}
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-spdx:
    name: Check our output with the SPDX tools
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve Go versions
        id: go-versions
        uses: carabiner-dev/actions/go/versions@2f56fd66c5ef961f72bca3dbacbbfbd9acc717ee # v1.3.2

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ steps.go-versions.outputs.GO_VERSION_STABLE }}
          cache: true

      # The SPDX Java tools run the reference implementation's Verify command.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install check-jsonschema
        run: pip install --disable-pip-version-check check-jsonschema==0.37.4

      # Renders every vendored document through the library and checks the
      # result against the official 3.0.1 JSON schema and the SPDX Java
      # tools, failing only where the tools accept the input but not ours.
      - name: Verify the documents the library writes
        run: ./hack/verify-spdx.sh --keep rendered

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: rendered-documents
          path: rendered
