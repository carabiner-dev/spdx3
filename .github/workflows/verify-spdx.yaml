name: Validate SPDX Conformance

on:
  workflow_dispatch: {}
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-spdx:
    name: Check our output with the SPDX tools
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve Go versions
        id: go-versions
        uses: carabiner-dev/actions/go/versions@36a39ef667efe7112df8b1a534a4e37f35fad6fd # v1.2.6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go-versions.outputs.GO_VERSION_STABLE }}
          cache: true

      # The SPDX Java tools run the reference implementation's Verify command.
      - uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4.5.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.13'

      - name: Install check-jsonschema
        run: pip install --disable-pip-version-check check-jsonschema==0.37.4

      # Renders every vendored document through the library and checks the
      # result against the official 3.0.1 JSON schema and the SPDX Java
      # tools, failing only where the tools accept the input but not ours.
      - name: Verify the documents the library writes
        run: ./hack/verify-spdx.sh --keep rendered

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: rendered-documents
          path: rendered
